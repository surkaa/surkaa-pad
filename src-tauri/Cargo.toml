[package]
name = "surkaa-pad"
default-run = "surkaa-pad"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "surkaa_pad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "oss_tool"
path = "src/bin/oss_tool.rs"
required-features = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2.4.4"
tauri-plugin-log = "2"
tauri-plugin-process = "2"
tauri-plugin-os = "2.3.2"

async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.145" # 用于 JSON 处理

# 一个通用的 AEAD 接口
chrono = "0.4.42" # 用于获取时间戳

# 异步
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
futures = "0.3"
futures-util = "0.3"

# 网络请求
reqwest = { version = "^0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
getrandom = "0.3"
hmac = "0.12.1"
sha1 = "0.10.6"
quick-xml = { version = "0.39", features = ["serialize"] }
base64 = "0.22.1"
md5 = "0.8"
bytes = "1.11"

hex = "0.4"

# 加密
aead = "0.5"
argon2 = "0.5"
aes-gcm = "0.10"
zeroize = { version = "1.8", features = ["derive"] }
aes = "0.8.4"
ctr = "0.9.2"

# 并发哈希映射
dashmap = "6"

# 能将rust的类型导出为typescript类型定义文件
specta = "=2.0.0-rc.22"
specta-typescript = "0.0.9"
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }
http-range-header = "0.4.2"
infer = "0.22"
urlencoding = "2.1.3"
image = "0.25.9"
rust-s3 = { git = "https://github.com/surkaa/rust-s3", rev = "b208afb843d160b3085055507c69382f07dfb931", default-features = false, features = ["with-tokio", "tokio-rustls-tls"] }
tokio-stream = "0.1.18"
thiserror = "2"
fs4 = "1"
dunce = "1"

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-biometric = { git = "https://github.com/surkaa/plugins-workspace", rev = "6fa3112f426dd3a05619fd1f34a00089807c5fd5" }
tauri-plugin-native-camera = "0.1.0"

[dev-dependencies]
# 临时文件夹
tempfile = "3"
# 读取.env文件
dotenvy = "0.15"
# 测试时保持互斥运行
serial_test = "3.3"
